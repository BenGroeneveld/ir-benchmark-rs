[package]
name = "ir-bench-gui"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
slint = "1.17.1"
iracing = { git = "https://github.com/BenGroeneveld/iracing.rs.git", branch = "master" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
json5 = "1.3.1"
anyhow = "1.0.104"
chrono = "0.4.45"
rfd = "0.17.2"
open = "5.3.4"
sysinfo = { version = "0.39.6" }

[build-dependencies]
slint-build = "1.17.1"

[profile.release]
codegen-units = 1
lto = true
